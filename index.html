<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Merry Xmas ❄</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Noto+Serif:ital@1&display=swap">
<style>
:root{color-scheme:dark;--bg:#000;--gold:#ffe3a0;--glow:#ff9a3c;--ink:#fff1e2;--dim:rgba(255,205,150,.7);--cw:min(88vw,440px);--ch:min(60vh,520px);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{margin:0;padding:0;box-sizing:border-box}
body{height:100%;background:var(--bg);overflow:hidden;overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
canvas,#st,#au{position:fixed;left:0;top:0;width:100%;height:100%;display:block;pointer-events:none}
#st{background:repeating-linear-gradient(90deg,rgba(255,255,255,.03) 0 6px,transparent 6px 12px)}
#au{left:-20%;top:-10%;width:140%;height:55%;mix-blend-mode:screen;background:radial-gradient(50% 55% at 30% 20%,rgba(40,255,170,.22),transparent 70%),radial-gradient(45% 50% at 72% 30%,rgba(255,70,120,.16),transparent 70%),radial-gradient(40% 45% at 50% 10%,rgba(90,160,255,.14),transparent 70%);animation:au 11s ease-in-out infinite alternate}
@keyframes au{from{transform:translateX(-5%) scale(1);opacity:.65}to{transform:translateX(6%) scale(1.15);opacity:1}}
#title{position:fixed;left:0;right:0;top:53%;text-align:center;font:700 clamp(30px,9.4vw,46px)/1.1 'Dancing Script','Segoe Script',cursive;color:var(--gold);text-shadow:0 0 6px var(--glow),0 0 22px rgba(255,59,78,.55);opacity:0;transform:translateY(8px) scale(.96);transition:opacity 2.4s ease,transform 2.4s ease}
#title.on{opacity:1;transform:none}
body.open #title{opacity:0;transition-duration:.6s}
/* ===== thiệp ===== */
#card{position:fixed;left:50%;top:50%;width:var(--cw);height:var(--ch);margin:calc(var(--ch)/-2) 0 0 calc(var(--cw)/-2);perspective:1400px;opacity:0;transform:translateY(55vh) scale(.46);transition:transform 1.5s cubic-bezier(.2,.9,.2,1),opacity .9s;pointer-events:none}
#card.show{opacity:1;transform:translateY(25vh) scale(.46);animation:fl 3.2s ease-in-out infinite}
#card.open{transform:none;animation:none}
@keyframes fl{50%{translate:0 -9px}}
.in{position:absolute;inset:0;border-radius:10px;overflow:hidden;background:radial-gradient(ellipse at 50% 0,#1c3b2a,#07140e 72%);box-shadow:inset 0 0 0 5px #07140e,inset 0 0 0 6px rgba(255,215,120,.55),0 0 40px rgba(255,190,90,.25)}
#card canvas{position:absolute;left:0;top:0;width:100%;height:100%;opacity:.55}
#card #ct{opacity:1}
#cm{-webkit-mask-image:linear-gradient(#000 40%,rgba(0,0,0,.3) 58%,rgba(0,0,0,.15) 75%);mask-image:linear-gradient(#000 40%,rgba(0,0,0,.3) 58%,rgba(0,0,0,.15) 75%)}
.tx{position:absolute;left:0;right:0;top:44%;bottom:0;padding:2% 8% 6%;display:flex;flex-direction:column;justify-content:flex-end;text-align:center}
#to{font:700 clamp(26px,8vw,38px)/1.15 'Dancing Script','Segoe Script',cursive;color:var(--gold);text-shadow:0 0 8px var(--glow);margin-bottom:.45em;min-height:1.15em}
#msg{font:italic 400 clamp(12.5px,3.5vw,15px)/1.75 'Noto Serif',Georgia,serif;color:var(--ink);text-shadow:0 1px 5px #000}
#msg.on::after{content:"|";margin-left:1px;color:var(--gold);animation:bl 1s steps(1) infinite}
#msg.done::after{content:none}
@keyframes bl{50%{opacity:0}}
#sig{margin-top:1em;font:italic 12.5px 'Noto Serif',Georgia,serif;color:var(--dim);opacity:0;transition:opacity 2.5s}
#sig.on{opacity:1}
i{font-style:normal;color:#6dffb4;text-shadow:0 0 8px #2dff8e}
.door{position:absolute;top:0;width:50%;height:100%;transform-style:preserve-3d;transition:transform 1.8s cubic-bezier(.3,.7,.2,1) .55s}
.l{left:0;transform-origin:0 50%}.r{right:0;transform-origin:100% 50%}
.open .l{transform:rotateY(-170deg)}.open .r{transform:rotateY(170deg)}
.f,.k{position:absolute;inset:0;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.l .f{border-radius:10px 0 0 10px}.r .f{border-radius:0 10px 10px 0}
.k{transform:rotateY(180deg);background:linear-gradient(160deg,#10301f,#06150e);box-shadow:inset 0 0 0 4px #06150e,inset 0 0 0 5px rgba(255,215,120,.5)}
.art{position:absolute;top:0;left:0;width:200%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6%;text-align:center;background:radial-gradient(circle at 50% 40%,rgba(255,255,255,.12),transparent 55%),repeating-linear-gradient(45deg,rgba(255,215,120,.07) 0 2px,transparent 2px 14px),linear-gradient(160deg,#a50f25,#5e0716 75%);box-shadow:inset 0 0 0 6px #5e0716,inset 0 0 0 7px rgba(255,215,120,.75),inset 0 0 0 12px #5e0716,inset 0 0 0 13px rgba(255,215,120,.4)}
.r .art{left:-100%}
.orn{width:15%;aspect-ratio:1;background:linear-gradient(135deg,#fff3b0,#d4a017);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.mc{font:700 calc(var(--cw)*.15)/1 'Dancing Script','Segoe Script',cursive;background:linear-gradient(100deg,#b8860b,#fff3b0 35%,#d4a017 50%,#fff3b0 65%,#b8860b);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 3.2s linear infinite;filter:drop-shadow(0 0 6px rgba(255,190,80,.55))}
@keyframes sh{to{background-position:200% 0}}
.art p{font:italic 12px 'Noto Serif',Georgia,serif;color:rgba(255,227,160,.8)}
#seal{position:absolute;left:50%;top:30%;width:15%;aspect-ratio:1;margin:-7.5% 0 0 -7.5%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe9a0,#d4a017 55%,#7a5200);box-shadow:0 0 14px rgba(255,200,90,.75);display:grid;place-items:center;color:#5e0716;font:700 calc(var(--cw)*.07)/1 serif;transition:transform .5s cubic-bezier(.6,-.4,.4,1.4),opacity .4s}
.open #seal{transform:scale(0);opacity:0}
#lg{position:absolute;left:50%;top:50%;width:170%;aspect-ratio:1;margin:-85% 0 0 -85%;border-radius:50%;opacity:0;pointer-events:none;background:repeating-conic-gradient(rgba(255,240,180,.4) 0 5deg,transparent 5deg 15deg);-webkit-mask:radial-gradient(circle,#000 8%,transparent 62%);mask:radial-gradient(circle,#000 8%,transparent 62%)}
.open #lg{animation:lg 2.6s ease-out .75s forwards}
@keyframes lg{0%{opacity:0;transform:scale(.1) rotate(0)}25%{opacity:1}100%{opacity:0;transform:scale(1.15) rotate(40deg)}}
#hint{position:fixed;left:0;right:0;bottom:calc(4.5% + env(safe-area-inset-bottom,0px));text-align:center;font:italic 13.5px 'Noto Serif',Georgia,serif;color:var(--gold);text-shadow:0 0 10px var(--glow);opacity:0;transition:opacity 1s;pointer-events:none}
#hint.on{opacity:1;animation:hp 2s ease-in-out infinite}
@keyframes hp{50%{opacity:.35}}
body.open #hint{opacity:0;animation:none}
#ft{position:fixed;left:0;right:0;bottom:calc(1.2% + env(safe-area-inset-bottom,0px));text-align:center;font:10px/1 system-ui,sans-serif;color:rgba(255,255,255,.42)}
#ft b{color:#fff;font-weight:500}
</style>
</head>
<body>
<canvas id="bg"></canvas><div id="au"></div><div id="st"></div><canvas id="fg"></canvas>
<div id="title"></div>
<div id="card">
  <div class="in"><canvas id="cm"></canvas><canvas id="ct"></canvas><div class="tx"><div id="to"></div><div id="msg"></div><div id="sig"></div></div></div>
  <div class="door l"><div class="f"><div class="art"></div></div><div class="k"></div></div>
  <div class="door r"><div class="f"><div class="art"></div></div><div class="k"></div></div>
  <div id="lg"></div><div id="seal">✦</div>
</div>
<div id="hint">✦ Chạm để mở thiệp ✦</div>
<div id="ft">Code By <b>NhutCoder</b> Team</div>
<script>
// ===== Sửa tên / lời chúc / chuỗi chữ ở đây =====
const CFG={
  name:'Hồng Lạc',
  to:'Gửi em, Hồng Lạc',
  // [chữ, số giây, màu hạt RGB] — chữ viết không dấu vì hạt chấm khó hiện dấu
  seq:[['3',1,[255,255,255]],['2',1,[255,255,255]],['1',1,[255,255,255]],['Merry',2.6,[255,70,85]],['Xmas',2.6,[70,230,140]],['My Love',3.2,[255,215,120]]],
  text:'Nhân dịp Giáng sinh, chúc em một mùa đông thật ấm áp, bình yên và ngập tràn tiếng cười. Cảm ơn em đã đến bên anh, thắp sáng những ngày lạnh nhất bằng nụ cười của em. Điều ước đẹp nhất của anh năm nay vẫn là em. Dù ngoài kia tuyết có rơi, gió có lạnh đến đâu, chỉ cần có em bên cạnh, mùa nào cũng là Giáng sinh của anh. Merry Christmas, em yêu.',
  sign:'— Một người luôn nghĩ đến em ❤'
};
const $=id=>document.getElementById(id),fgc=$('fg'),fg=fgc.getContext('2d'),card=$('card');
const R=Math.random,TAU=Math.PI*2,NP=720,NT=300,FW=[.5,.13,.13,.16,.08],GC=[5,1,0,4],CF=['#ff3b4e','#3ddc84','#ffd36a','#ffffff'],SC='0123456789ABCDEFMNRSXZ+*<>';
let W,H,dpr=1,snow=[],stars=[],P=[],si=-1,pts=[],r0=8,phase=0,T=-.6,HT=0,cx,tp,TH,RM,time=0,rt,shown=0,showT=0,opened=0,OT=0,b1=0,TO=null,MS=null,fin=0,ssT=3,fwT=1;
const cc=[255,255,255],fx=[],ss=[];
$('title').textContent=CFG.name;$('sig').textContent=CFG.sign;
document.querySelectorAll('.art').forEach(a=>a.innerHTML='<b class="orn"></b><div class="mc">Merry<br>Christmas</div><p>Dành tặng '+CFG.name+'</p>');
const pick=w=>{const u=R();let s=0;for(let i=0;i<w.length;i++){s+=w[i];if(u<s)return i}return 0};

// mưa chữ (dùng cho nền và cho bên trong thiệp)
function Rain(cv,pal,chars,fs){
  const g=cv.getContext('2d'),cw=fs+4,lh=fs+2;let w,h,dr=[],acc=0;
  return{
    size(a,b){w=a;h=b;cv.width=w*dpr;cv.height=h*dpr;g.setTransform(dpr,0,0,dpr,0,0);dr=[];
      for(let i=0;i<Math.ceil(w/cw);i++)dr.push({y:-R()*40,v:.35+R()*.6,on:R()<.55,row:-1,ch:'M',c:R()<.5?0:1})},
    tick(dt){
      acc+=dt;if(acc<.07)return;acc=0;
      g.globalCompositeOperation='destination-out';g.fillStyle='rgba(0,0,0,.1)';g.fillRect(0,0,w,h);g.globalCompositeOperation='source-over';
      g.font='700 '+fs+'px ui-monospace,Menlo,monospace';g.textAlign='center';
      dr.forEach((d,i)=>{
        if(!d.on){if(R()<.01)d.on=true;return}
        d.y+=d.v;const row=d.y|0;if(row===d.row)return;const x=i*cw+cw/2;
        if(d.row>=0){g.fillStyle=pal[d.c][0];g.fillText(d.ch,x,d.row*lh)}
        d.row=row;d.ch=R()<.06?'♥':chars[(R()*chars.length)|0];
        g.fillStyle=R()<.5?'rgba(255,240,215,.55)':pal[d.c][1];g.fillText(d.ch,x,row*lh);
        if(row*lh>h&&R()<.04){d.y=-R()*30;d.row=-1;d.on=R()<.6;d.c=R()<.5?0:1}
      });
    }};
}
const RB=Rain($('bg'),[['rgba(205,35,55,.5)','rgba(255,110,120,.75)'],['rgba(35,170,90,.5)','rgba(120,255,170,.7)']],'MERRYCHRISTMAS',20);
const RC=Rain($('cm'),[['rgba(40,200,110,.5)','rgba(190,255,215,.85)'],['rgba(220,170,60,.45)','rgba(255,235,170,.85)']],'MERRYXMAS01',16);

// gõ chữ + giải mã kiểu matrix: 3 ký tự cuối nhấp nháy xanh rồi mới hiện chữ thật
function Typer(el,text,cps){
  const tn=document.createTextNode(''),ie=document.createElement('i');el.append(tn,ie);
  let t=0,done=0;
  return{get done(){return done},step(dt){
    if(done)return;t+=dt;const n=Math.min(text.length,(t*cps)|0),a=Math.max(0,n-3);let g='';
    for(let i=a;i<n;i++)g+=text[i]===' '?' ':SC[(R()*SC.length)|0];
    tn.nodeValue=text.slice(0,a);ie.textContent=g;
    if(n>=text.length){done=1;tn.nodeValue=text;ie.textContent=''}
  }};
}

// sprite: đèn phát sáng, tim đỏ, ngôi sao
const mkc=()=>{const c=document.createElement('canvas');c.width=c.height=64;return c};
const dot=(r,g,b)=>{const c=mkc(),x=c.getContext('2d'),q=x.createRadialGradient(32,32,0,32,32,26);
  q.addColorStop(0,'#fff');q.addColorStop(.22,'rgb('+r+','+g+','+b+')');q.addColorStop(1,'rgba('+r+','+g+','+b+',0)');
  x.fillStyle=q;x.fillRect(0,0,64,64);return c};
const heart=(c1,c2)=>{const c=mkc(),x=c.getContext('2d');x.translate(32,34);x.shadowColor=c1;x.shadowBlur=10;
  const g=x.createRadialGradient(0,-4,2,0,0,24);g.addColorStop(0,'#ffd0d6');g.addColorStop(.35,c1);g.addColorStop(1,c2);x.fillStyle=g;
  x.beginPath();for(let i=0;i<=40;i++){const t=i/40*TAU,hx=16*Math.sin(t)**3,hy=13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t),X=hx*.78,Y=-(hy+2.5)*.78;i?x.lineTo(X,Y):x.moveTo(X,Y)}
  x.closePath();x.fill();return c};
const star=()=>{const c=mkc(),x=c.getContext('2d');x.translate(32,33);x.shadowColor='#ffb300';x.shadowBlur=10;x.fillStyle='#ffe58a';
  x.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?7.5:19,X=Math.cos(a)*rr,Y=Math.sin(a)*rr;i?x.lineTo(X,Y):x.moveTo(X,Y)}
  x.closePath();x.fill();return c};
// 0 xanh · 1 vàng · 2 trắng · 3 tim đỏ · 4 xanh băng · 5 đỏ
const SPR=[dot(60,225,120),dot(255,205,90),dot(255,240,215),heart('#ff3b55','#8f0018'),dot(120,190,255),dot(255,70,80)],STAR=star(),HALO=dot(255,200,110);

// ===== cây thông hạt BÊN TRONG thiệp — lấy đúng cây ngoài: cùng sprite, cùng hình nón xoay ốc sên =====
const ctc=$('ct').getContext('2d');let CTP=[],ctW=0,ctH=0,ctTH=0;
function ctLayout(){
  const w=card.offsetWidth,h=card.offsetHeight;ctW=w;ctH=h;
  const cv=$('ct');cv.width=w*dpr;cv.height=h*dpr;ctc.setTransform(dpr,0,0,dpr,0,0);
  const tp2=h*.055;ctTH=Math.min(h*.36,h-tp2-h*.47);
  const RMt=Math.min(w*.32,ctTH*.46),n=Math.max(110,Math.min(170,(w*h/950)|0));
  CTP=[];
  for(let i=0;i<n;i++){
    const big=i<n*.08;let kd,hh,th0;
    if(big){kd=R()<.65?1:3;hh=.08+R()*.16;th0=R()*TAU}
    else if(R()<.28){kd=pick(FW);hh=.08+.92*Math.pow(R(),.72);th0=hh*13+(R()-.5)*.3}
    else{kd=pick(FW);hh=.08+.92*Math.pow(R(),.72);th0=R()*TAU}
    const f=(hh*3)%1,rad=RMt*hh*(.72+.28*f)*(big?1:1.05);
    CTP.push({sx:R()*w,sy:R()<.5?-h*.1-R()*h*.1:h+R()*h*.12,hh,th0,rad,kd,
      d:2.1+R()*1.1,sz:(6.5+Math.pow(R(),1.4)*12)*w/340*(big?1.8:1),ph:R()*TAU,sp:1.6+R()*3.4});
  }
}
const ob=t=>{t=Math.min(1,Math.max(0,t));return 1+2.7*Math.pow(t-1,3)+1.7*Math.pow(t-1,2)};
function ctDraw(){
  if(!CTP.length)return;const w=ctW,h=ctH;ctc.clearRect(0,0,w,h);
  ctc.globalCompositeOperation='lighter';
  const cx2=w/2,tp2=h*.055;
  for(const p of CTP){
    const pr=Math.min(1,Math.max(0,(OT-p.d)/.85));if(pr<=0)continue;
    const e=1-Math.pow(1-pr,3),th=p.th0+time*.42,tw=.5+.5*Math.sin(time*p.sp+p.ph);
    const tx=cx2+Math.cos(th)*p.rad,ty=tp2+p.hh*ctTH;
    const x=p.sx+(tx-p.sx)*e,y=p.sy+(ty-p.sy)*e,s=p.sz*(.8+.25*tw)*(.3+.7*e);
    ctc.globalAlpha=e*(.45+.55*tw);
    ctc.drawImage(SPR[p.kd],x-s/2,y-s/2,s,s);
  }
  const ss2=ob((OT-3.1)/.7);
  if(ss2>0){
    const sy=h*.062,s2=w*.115*ss2,a=Math.sin(time*.9)*.12,pl=1+.07*Math.sin(time*2.4),cs=Math.cos(a),sn=Math.sin(a);
    ctc.globalAlpha=.5*ss2;ctc.drawImage(HALO,cx2-s2*.95*pl,sy-s2*.95*pl,s2*1.9*pl,s2*1.9*pl);
    ctc.globalAlpha=ss2;ctc.setTransform(dpr*cs,dpr*sn,-dpr*sn,dpr*cs,cx2*dpr,sy*dpr);
    ctc.drawImage(STAR,-s2/2,-s2/2,s2,s2);ctc.setTransform(dpr,0,0,dpr,0,0);
  }
  ctc.globalAlpha=1;
}
// co chữ lời chúc vừa khung dưới thiệp -> luôn thấy hết chữ
function fitMsg(){
  const m=$('msg'),to=$('to'),sg=$('sig');
  const avail=card.offsetHeight*.56-card.offsetHeight*.07-to.offsetHeight-sg.offsetHeight-8;
  m.style.fontSize='';let fs=parseFloat(getComputedStyle(m).fontSize);
  for(let i=0;i<24;i++){
    m.style.fontSize=fs+'px';m.textContent=CFG.text;
    if(m.offsetHeight<=avail||fs<=9.5)break;fs-=.5;
  }
  m.textContent='';
}
function layout(){
  dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  fgc.width=W*dpr;fgc.height=H*dpr;fg.setTransform(dpr,0,0,dpr,0,0);
  RB.size(W,H);if(opened){RC.size(card.offsetWidth,card.offsetHeight);ctLayout();if(!MS)fitMsg()}
  snow=[];for(let i=0;i<110;i++){const r=.7+R()*R()*3.4;snow.push({x:R()*W,y:R()*H,r,v:16+r*13+R()*14,a:.18+R()*.6,p:R()*TAU,w:6+R()*14})}
  stars=[];for(let i=0;i<70;i++)stars.push({x:R()*W,y:R()*H*.75,r:.8+R()*1.4,p:R()*TAU,s:1+R()*3});
  cx=W/2;tp=H*.11;TH=Math.min(H*.37,W*1.05);RM=Math.min(W*.3,TH*.42);
  if(si>=0&&phase===0)assign(si);
}
function initP(){
  P=[];for(let i=0;i<NP;i++)P.push({x:W/2,y:H*.43,vx:0,vy:0,tx:0,ty:0,r:14,a:1,has:0,sd:R(),k:.65+R()*.8,m:0,h:0,th:0,rr:1,kd:0,sz:0,z:1,ta:1,tk:0,ox:0});
}

// lấy điểm từ chữ
function sample(str,num){
  const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d',{willReadFrequently:true});
  x.font='900 100px sans-serif';const m=x.measureText(str).width;
  const fs=Math.min(100*W*.86/m,H*(num?.4:.26));
  x.font='900 '+fs+'px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillStyle='#fff';x.fillText(str,W/2,H*.43);
  const d=x.getImageData(0,0,W,H).data;let st=Math.max(7,fs/(num?22:10)),o;
  for(;;){o=[];for(let y=st/2;y<H;y+=st)for(let xx=st/2;xx<W;xx+=st)if(d[(((y|0)*W)+(xx|0))*4+3]>128)o.push([xx,y]);
    if(o.length<=NT-10||st>40)break;st*=1.1}
  return{pts:o,r:st*(num?.62:.42)};
}
function assign(i){
  const s=CFG.seq[i][0],o=sample(s,/^\d$/.test(s));pts=o.pts;r0=o.r;
  for(let j=pts.length-1;j>0;j--){const k=(R()*(j+1))|0;[pts[j],pts[k]]=[pts[k],pts[j]]}
  P.forEach((p,j)=>{if(j<pts.length){p.has=1;p.tx=pts[j][0];p.ty=pts[j][1]}else p.has=0});
}
// chữ vỡ ra thành cây thông
function toTree(){
  phase=1;HT=0;const act=P.filter(p=>p.has);
  P.forEach((p,i)=>{
    if(!p.has){const q=act[(R()*act.length)|0]||p;p.x=q.x+(R()-.5)*20;p.y=q.y+(R()-.5)*20;p.a=0}
    p.has=1;p.tk=0;let big=0;
    if(i<28){big=1;p.kd=R()<.7?3:1;p.h=.18+R()*.78;p.th=R()*TAU;p.rr=1.02}
    else if(i<70){p.tk=1;p.kd=1;p.ox=(R()-.5)*.1;p.h=1+R()*.1;p.th=0;p.rr=1}
    else if(i<250){p.kd=R()<.6?1:2;p.h=.04+.94*(i-70)/180;p.th=p.h*15;p.rr=1.05}
    else{p.kd=pick(FW);p.h=Math.sqrt(R());p.th=R()*TAU;p.rr=Math.pow(R(),.35)}
    p.sz=(9+Math.pow(R(),1.5)*15)*W/360*(big?1.9:1);p.ta=.55+R()*.45;
    p.vx+=(R()-.5)*380;p.vy+=(R()-.5)*380;
  });
}

// hiệu ứng: pháo hoa, confetti, tia lấp lánh
function burst(x,y,n,conf){
  for(let i=0;i<n;i++){const a=R()*TAU,v=60+R()*(conf?300:220);
    fx.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-(conf?160:40),l:1.4+R()*1.4,k:conf?-1:[5,1,0,3,1,4][(R()*6)|0],c:(R()*4)|0,s:conf?6+R()*6:10+R()*14,r:R()*TAU,vr:(R()-.5)*12,g:conf?240:110})}
}
function firework(x,y){
  const k=[5,1,0,4,3][(R()*5)|0],n=42;
  for(let i=0;i<n;i++){const a=i/n*TAU,v=110+(i%2)*55+R()*20;
    fx.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:1.3+R()*.5,k:i%5===0?1:k,c:0,s:11+R()*7,r:0,vr:0,g:70})}
}
function spark(x,y){
  for(let i=0;i<2;i++)fx.push({x:x+(R()-.5)*8,y:y+(R()-.5)*8,vx:(R()-.5)*60,vy:(R()-.5)*60-12,l:.7,k:R()<.5?1:2,c:0,s:12+R()*10,r:0,vr:0,g:40});
}

// mở thiệp
function openCard(){
  if(opened||!shown)return;opened=1;card.classList.add('open');document.body.classList.add('open');
  RC.size(card.offsetWidth,card.offsetHeight);ctLayout();fitMsg();
}
function cardFlow(dt){
  OT+=dt;RC.tick(dt);
  if(OT>1.3&&!b1){b1=1;burst(W/2,H/2,80,0);burst(W/2,H/2,120,1)}
  if(OT>2.2){
    TO=TO||Typer($('to'),CFG.to,15);TO.step(dt);
    if(TO.done){
      if(!MS){fitMsg();MS=Typer($('msg'),CFG.text,17);$('msg').classList.add('on')}
      MS.step(dt);
      if(MS.done&&!fin){fin=1;$('msg').classList.add('done');$('sig').classList.add('on');burst(W/2,H/2,70,0);burst(W/2,H/2,100,1)}
    }
  }
  fwT-=dt;if(OT>2.6&&fwT<0){fwT=1.4+R()*1.8;firework(W*(.1+R()*.8),H*(.06+R()*.26))}
}

function upd(dt){
  time+=dt;
  if(phase===0){
    T+=dt;let acc=0,idx=CFG.seq.length;
    for(let i=0;i<CFG.seq.length;i++){acc+=CFG.seq[i][1];if(T<acc){idx=i;break}}
    if(idx>=CFG.seq.length)toTree();else if(T>=0&&idx!==si){si=idx;assign(si)}
  }else{
    HT+=dt;
    if(HT>2.2)$('title').classList.add('on');
    if(HT>3.2&&!shown){shown=1;showT=HT;card.classList.add('show');$('hint').classList.add('on')}
    if(shown&&!opened&&HT-showT>9)openCard();
  }
  if(opened){cardFlow(dt);ctDraw()}
  const hold=phase===0&&si<0,tg=CFG.seq[Math.max(0,si)][2];
  for(let i=0;i<3;i++)cc[i]+=(tg[i]-cc[i])*Math.min(1,dt*5);
  for(const p of P){
    let tx,ty,k=60*p.k,c=9;
    if(phase===0){if(p.has){tx=p.tx;ty=p.ty}else{tx=p.x;ty=p.y;k=0}}
    else{
      if(p.tk){tx=cx+p.ox*TH;ty=tp+p.h*TH;p.z=1}
      else{const th=p.th+time*.5,f=(p.h*3)%1,rad=RM*p.h*(.72+.28*f)*p.rr;tx=cx+Math.cos(th)*rad;ty=tp+p.h*TH;p.z=Math.sin(th)}
      k=26*p.k;c=6;p.m=Math.min(1,p.m+dt*.5);
    }
    p.vx+=(tx-p.x)*k*dt;p.vy+=(ty-p.y)*k*dt;const dm=Math.exp(-c*dt);p.vx*=dm;p.vy*=dm;p.x+=p.vx*dt;p.y+=p.vy*dt;
    if(phase===0){
      const dist=Math.hypot(tx-p.x,ty-p.y),want=hold?14:p.has?r0*(1+p.sd*Math.min(dist/50,1)*1.7):0;
      p.r+=(want-p.r)*Math.min(1,dt*8);p.a+=((hold?1:p.has?.95:0)-p.a)*Math.min(1,dt*6);
    }else{p.a+=(p.ta-p.a)*Math.min(1,dt*3);p.r*=1-Math.min(1,dt*3)}
  }
  // ===== vẽ =====
  fg.clearRect(0,0,W,H);fg.globalCompositeOperation='source-over';fg.fillStyle='#fff';
  for(const s of stars){fg.globalAlpha=.2+.6*(.5+.5*Math.sin(time*s.s+s.p));fg.fillRect(s.x,s.y,s.r,s.r)}
  for(const d of snow){
    d.y+=d.v*dt;d.x+=Math.sin(time*.8+d.p)*d.w*dt;
    if(d.y>H+6){d.y=-6;d.x=R()*W}if(d.x<-6)d.x=W+6;else if(d.x>W+6)d.x=-6;
    fg.globalAlpha=d.a;fg.beginPath();fg.arc(d.x,d.y,d.r,0,TAU);fg.fill();
  }
  const gn=Math.ceil(W/46),sw=W/gn,ga=Math.min(1,time/1.5);
  fg.globalAlpha=.18*ga;fg.strokeStyle='#fff';fg.lineWidth=1;fg.beginPath();
  for(let i=0;i<gn;i++){fg.moveTo(i*sw,2);fg.quadraticCurveTo(i*sw+sw/2,26,(i+1)*sw,2)}fg.stroke();
  fg.globalCompositeOperation='lighter';
  for(let i=0;i<gn*3;i++){ // dây đèn nhấp nháy
    const t=(i%3+.5)/3,x=((i/3)|0)*sw+t*sw,y=2*(1-t)*(1-t)+52*t*(1-t)+2*t*t+4;
    fg.globalAlpha=ga*(.3+.7*(.5+.5*Math.sin(time*2.6+i*1.7)));fg.drawImage(SPR[GC[i%4]],x-9,y-9,18,18);
  }
  fg.fillStyle='rgb('+(cc[0]|0)+','+(cc[1]|0)+','+(cc[2]|0)+')';
  for(const p of P){
    if(p.r>.3&&p.a>.01){fg.globalAlpha=p.a*(phase?1-p.m:1);fg.beginPath();fg.arc(p.x,p.y,p.r,0,TAU);fg.fill()}
    if(phase&&p.m>0){
      const zf=(p.z+1)/2,s=p.sz*p.m*(.75+.4*zf);
      fg.globalAlpha=Math.max(0,p.a)*p.m*(.45+.55*zf)*(.72+.28*Math.sin(time*(2+p.sd*4)+p.sd*40));
      fg.drawImage(SPR[p.kd],p.x-s/2,p.y-s/2,s,s);
    }
  }
  if(phase){ // ngôi sao trên đỉnh
    const u=W/360,sa=Math.min(1,Math.max(0,(HT-1.2)/1.5)),pl=1+.08*Math.sin(time*2.4),sy=tp-2,a=Math.sin(time*.9)*.15,cs=Math.cos(a),sn=Math.sin(a);
    fg.globalAlpha=sa*.55;fg.drawImage(HALO,cx-48*u*pl,sy-48*u*pl,96*u*pl,96*u*pl);
    fg.globalAlpha=sa;fg.setTransform(dpr*cs,dpr*sn,-dpr*sn,dpr*cs,cx*dpr,sy*dpr);
    const s2=52*u*pl;fg.drawImage(STAR,-s2/2,-s2/2,s2,s2);fg.setTransform(dpr,0,0,dpr,0,0);
  }
  // pháo hoa / confetti / tia lấp lánh
  if(fx.length>650)fx.splice(0,fx.length-650);
  for(let i=fx.length-1;i>=0;i--){
    const f=fx[i];f.l-=dt;if(f.l<=0){fx.splice(i,1);continue}
    f.vy+=f.g*dt;const dm=Math.exp(-dt*1.3);f.vx*=dm;f.vy*=dm;f.x+=f.vx*dt;f.y+=f.vy*dt;f.r+=f.vr*dt;
    fg.globalAlpha=Math.min(1,f.l/.8);
    if(f.k>=0)fg.drawImage(SPR[f.k],f.x-f.s/2,f.y-f.s/2,f.s,f.s);
    else{const c=Math.cos(f.r),s=Math.sin(f.r),q=Math.cos(f.r*1.7);
      fg.setTransform(dpr*c,dpr*s,-dpr*s*q,dpr*c*q,f.x*dpr,f.y*dpr);fg.fillStyle=CF[f.c];fg.fillRect(-f.s/2,-f.s/3,f.s,f.s*.66);fg.setTransform(dpr,0,0,dpr,0,0)}
  }
  // sao băng
  ssT-=dt;if(ssT<0){ssT=3+R()*4;const a=2.4+R()*.25;ss.push({x:W*(.35+R()*.65),y:-10+R()*H*.18,vx:Math.cos(a)*720,vy:Math.sin(a)*720,l:1})}
  for(let i=ss.length-1;i>=0;i--){
    const s=ss[i];s.l-=dt;if(s.l<=0){ss.splice(i,1);continue}
    s.x+=s.vx*dt;s.y+=s.vy*dt;const tx=s.x-s.vx*.16,ty=s.y-s.vy*.16,g=fg.createLinearGradient(s.x,s.y,tx,ty);
    g.addColorStop(0,'rgba(255,255,255,.95)');g.addColorStop(1,'rgba(255,255,255,0)');
    fg.globalAlpha=Math.min(1,s.l*3);fg.strokeStyle=g;fg.lineWidth=2;fg.beginPath();fg.moveTo(s.x,s.y);fg.lineTo(tx,ty);fg.stroke();
  }
  fg.globalAlpha=1;
}

layout();initP();
addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(layout,150)});
addEventListener('pointerdown',e=>{if(shown&&!opened)openCard();else burst(e.clientX,e.clientY,24,0)});
addEventListener('pointermove',e=>{if(phase)spark(e.clientX,e.clientY)});
let last=performance.now();
(function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;RB.tick(dt);upd(dt);requestAnimationFrame(frame)})(last);
</script>
</body>
</html>
